<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Байланысу | 667 NBS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Барлық стильдерді about.html сияқты көшіріңіз */
        /* Тек форма стильдерін қосамыз */
        
        .contact-form {
            margin-top: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--neon-blue);
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            font-family: inherit;
        }
        
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .submit-btn {
            background: var(--neon-blue);
            color: var(--dark-bg);
            padding: 1rem 2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .submit-btn:hover {
            background: var(--neon-pink);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 247, 0.3);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-link">Басты бет</a>
            <a href="about.html" class="nav-link">Мен туралы</a>
            <a href="contact.html" class="nav-link active">Байланысу</a>
        </div>
    </nav>

    <div class="container">
        <h1>БАЙЛАНЫСУ</h1>
        
        <div class="section">
            <h2>➤ БАЙЛАНЫС АҚПАРАТЫ</h2>
            <p>Маған келесі арқылы хабарласа аласыз:</p>
            <div class="specs">
Instagram: <a href="https://www.instagram.com/vipnbs" style="color: var(--neon-blue);">@vipnbs</a>
Discord: <a href="https://discord.gg/6yTXd7ZKFc" style="color: var(--neon-blue);">667 NBS Server</a>
Email: example@email.com
            </div>
        </div>

        <div class="section">
            <h2>➤ ХАТ ЖІБЕРУ</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Аты-жөніңіз</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Хабарлама</label>
                    <textarea id="message" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Жіберу</button>
            </form>
        </div>
    </div>

    <script>
        // Форманы өңдеу
        document.querySelector('.contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Рахмет! Хабарламаңыз жіберілді. Жақын арада сізге жауап беремін.');
            this.reset();
        });
    </script>
</body>
</html>
